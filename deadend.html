<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tour de Preznev" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <title>Tour de Preznev</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: 'Roboto', sans-serif;
      background: #fafafa;
      color: #000;
    }

    .header-bar {
      width: 100%;
      height: 150px;
      background-color: #DDA15E;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      flex-shrink: 0;
      padding-right: 50px;
    }
    .header-bar h1 {
      margin: 0;
      color: #000;
      font-family: 'Merriweather', sans-serif;
      font-size: 36px;
      text-align: center;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .hamburger-menu {
      display: none;
      font-size: 30px;
      cursor: pointer;
      position: absolute;
      right: 20px;
      user-select: none;
    }

    .content-bar {
      width: 100%;
      height: 50px;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      justify-content: center;
      align-items: center;
      display: flex;
      flex-shrink: 0;
    }
    nav.desktop-nav {
      display: flex;
      gap: 50px;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    nav.desktop-nav a {
      text-decoration: none;
      color: #000;
      font-size: 18px;
    }
    nav.desktop-nav a:hover { color: #DDA15E; }

    nav.mobile-nav {
      display: none;
      flex-direction: column;
      background-color: #fff;
      position: absolute;
      top: 150px;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 20;
    }
    nav.mobile-nav a {
      text-decoration: none;
      color: #000;
      font-size: 18px;
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #DDA15E;
    }

    .main { width: 100%; display: flex; justify-content: center; padding: 36px 0 40px; }
    .scoreboard {
      width: min(980px, 92%);
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
      padding: 22px;
    }

    /* ✅ 100% responsiivinen kuva */
    .image-wrap{
      width: 100%;
    }
    .centered-image{
      display: block;
      width: 100%;        /* täyttää aina containerin leveyden */
      max-width: 100%;    /* varmistus ettei ylitä */
      height: auto;       /* säilyttää kuvasuhteen */
      border-radius: 14px;
    }

    .footer-bar {
      width: 100%;
      height: 200px;
      background-color: #DDA15E;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: auto;
      flex-shrink: 0;
    }
    .footer-bar h1 {
      margin: 0;
      color: #000;
      font-family: 'Merriweather', sans-serif;
      font-size: 18px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .header-bar h1 { font-size: 24px; }
      .content-bar { display: none; }
      .hamburger-menu { display: block; }
      nav.mobile-nav { display: none; }

      /* ✅ tärkeä: pienempi padding mobiilissa -> kuva mahtuu ja näyttää hyvältä */
      .scoreboard { padding: 12px; }

      .footer-bar { height: 100px; }
      .footer-bar h1 { font-size: 16px; }
    }
  </style>
</head>

<body>
  <div class="header-bar">
    <h1>Tour de Preznev</h1>
    <div class="hamburger-menu" onclick="toggleMenu()">&#9776;</div>
  </div>

  <div class="content-bar">
    <nav class="desktop-nav">
      <a href="liveseuranta.html">Liveseuranta</a>
      <a href="provo.html">Provoseinä</a>
      <a href="haista.html">Palaute</a>
      <a href="deadend.html">Yhteystiedot</a>
    </nav>
  </div>

  <nav id="nav-menu" class="mobile-nav">
    <a href="liveseuranta.html">Liveseuranta</a>
    <a href="provo.html">Provoseinä</a>
    <a href="haista.html">Palaute</a>
    <a href="deadend.html">Yhteystiedot</a>
  </nav>

  <main class="main">
    <section class="scoreboard" aria-label="Sisältöalue">
      <div class="image-wrap">
        <img src="paavi.jpg" alt="Habemus Papam!" class="centered-image">
      </div>
    </section>
  </main>

  <div class="footer-bar">
    <h1>Copyright @kipsipaavi 2026</h1>
  </div>

  <script>
    function toggleMenu() {
      var navMenu = document.getElementById("nav-menu");
      navMenu.style.display = (navMenu.style.display === "flex") ? "none" : "flex";
    }

    window.addEventListener('resize', function() {
      var navMenu = document.getElementById("nav-menu");
      if (window.innerWidth > 768) navMenu.style.display = "none";
    });

    window.addEventListener('click', function(event) {
      var navMenu = document.getElementById("nav-menu");
      var hamburgerMenu = document.querySelector(".hamburger-menu");
      if (window.innerWidth <= 768 && hamburgerMenu && !hamburgerMenu.contains(event.target) && !navMenu.contains(event.target)) {
        navMenu.style.display = "none";
      }
    });
  </script>
</body>
</html>
