<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour de Preznev</title>

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

<style>
body { font-family:'Roboto', sans-serif; margin:0; display:flex; flex-direction:column; min-height:100vh; }
.header { background:#DDA15E; padding:20px; text-align:center; font-family:'Merriweather', serif; }
.container { width:90%; max-width:1000px; margin:auto; }
.scoreboard { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:15px; margin-top:20px; }
.team-card { background:#f4f4f4; padding:15px; border-radius:10px; text-align:center; }
.team-card.winner { background:#c8e6c9; transform:scale(1.05); }
button { padding:6px 10px; margin:5px; border:none; background:#DDA15E; cursor:pointer; font-weight:bold; }
button:hover { background:#c68c4f; }
.hidden { display:none; }
.footer { margin-top:auto; padding:20px; background:#DDA15E; text-align:center; }
</style>
</head>
<body>

<div class="header">
<h1>Tour de Preznev</h1>
</div>

<div class="container">

<!-- LOGIN -->
<div id="loginBox">
    <h3>Admin kirjautuminen</h3>
    <input type="email" id="email" placeholder="Sähköposti"><br>
    <input type="password" id="password" placeholder="Salasana"><br>
    <button onclick="login()">Kirjaudu</button>
    <p id="loginError" style="color:red;"></p>
</div>

<!-- ADMIN CONTROLS -->
<div id="adminControls" class="hidden">
    <h3>Admin hallinta</h3>
    <input type="text" id="team1" placeholder="Joukkue 1">
    <input type="text" id="team2" placeholder="Joukkue 2">
    <input type="text" id="team3" placeholder="Joukkue 3">
    <input type="text" id="team4" placeholder="Joukkue 4">
    <br>
    <button onclick="createGame()">Aloita peli</button>
    <button onclick="resetScores()">Nollaa pisteet</button>
    <button onclick="logout()">Kirjaudu ulos</button>
</div>

<div id="scoreboard" class="scoreboard"></div>

</div>

<div class="footer">Copyright @kipsipaavi 2026</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCruKQXd8WPGeEbifcgiCa9o09wC0Wehfo",
  authDomain: "liveseuranta-f9988.firebaseapp.com",
  databaseURL: "https://liveseuranta-f9988-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "liveseuranta-f9988",
  storageBucket: "liveseuranta-f9988.firebasestorage.app",
  messagingSenderId: "414199918",
  appId: "1:414199918:web:b3437550d9a8a91bd8367f"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const auth = getAuth(app);

let teams = [];
let isAdmin = false;

/* ===== AUTH ===== */
window.login = function(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
        .catch(error => {
            document.getElementById("loginError").innerText = "Kirjautuminen epäonnistui";
        });
}

window.logout = function(){
    signOut(auth);
}

onAuthStateChanged(auth, user => {
    if(user){
        isAdmin = true;
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("adminControls").classList.remove("hidden");
    } else {
        isAdmin = false;
        document.getElementById("loginBox").classList.remove("hidden");
        document.getElementById("adminControls").classList.add("hidden");
    }
});

/* ===== DATABASE LISTENER ===== */
onValue(ref(database,"gameData"), snapshot=>{
    const data = snapshot.val();
    if(!data) return;
    teams = data;
    render();
});

/* ===== ADMIN ACTIONS ===== */
window.createGame = function(){
    if(!isAdmin) return;

    teams = [
        {name:team1.value, score:0},
        {name:team2.value, score:0},
        {name:team3.value, score:0},
        {name:team4.value, score:0}
    ];

    set(ref(database,"gameData"), teams);
}

window.resetScores = function(){
    if(!isAdmin) return;
    teams.forEach(t=>t.score=0);
    set(ref(database,"gameData"), teams);
}

window.addPoint = function(index){
    if(!isAdmin) return;
    teams[index].score++;
    set(ref(database,"gameData"), teams);
}

window.removePoint = function(index){
    if(!isAdmin) return;
    if(teams[index].score>0) teams[index].score--;
    set(ref(database,"gameData"), teams);
}

/* ===== RENDER ===== */
function render(){
    const board = document.getElementById("scoreboard");
    board.innerHTML="";

    teams.sort((a,b)=>b.score-a.score);
    const max = Math.max(...teams.map(t=>t.score));

    teams.forEach((team,index)=>{
        const card=document.createElement("div");
        card.className="team-card";
        if(team.score===max && max>0) card.classList.add("winner");

        let controls="";
        if(isAdmin){
            controls=`<br>
                <button onclick="addPoint(${index})">+1</button>
                <button onclick="removePoint(${index})">-1</button>`;
        }

        card.innerHTML=`
            <h3>${team.name}</h3>
            <p>Pisteet: ${team.score}</p>
            ${controls}
        `;
        board.appendChild(card);
    });
}

</script>
</body>
</html>
