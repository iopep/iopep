<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tervetuloa Suomalaiset antikvariaatit -sivustolle!">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header-bar {
            width: 100%;
            height: 150px;
            background-color: #DDA15E;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .header-bar h1 {
            color: #000;
            font-family: 'Merriweather', sans-serif;
            font-size: 36px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .hamburger-menu {
            display: none;
            font-size: 30px;
            cursor: pointer;
            position: absolute;
            right: 20px;
        }

        .content-bar {
            width: 100%;
            height: 50px;
            background-color: #FFF;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav.desktop-nav {
            display: flex;
            gap: 50px;
        }

        nav.desktop-nav a {
            text-decoration: none;
            color: #000;
            font-family: 'Roboto', sans-serif;
            font-size: 18px;
        }

        nav.desktop-nav a:hover { color: #DDA15E; }

        nav.mobile-nav {
            display: none;
            flex-direction: column;
            background-color: #FFF;
            position: absolute;
            top: 150px;
            width: 100%;
        }

        nav.mobile-nav a {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #DDA15E;
            text-decoration: none;
            color: #000;
        }

        .centered-image {
            max-width: 700px;
            width: 80%;
            margin: 40px auto;
            display: block;
        }

        .frontpage-text {
            font-family: 'Roboto', sans-serif;
            font-size: 18px;
            margin: 40px auto;
            max-width: 700px;
            width: 80%;
        }

        /* UUSI TULOSSEURANTA */
        .score-section {
            max-width: 900px;
            width: 90%;
            margin: 40px auto;
            font-family: 'Roboto', sans-serif;
        }

        .team-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .team-inputs input {
            padding: 10px;
            font-size: 16px;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .team-card {
            background-color: #f4f4f4;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .team-card h3 {
            margin-bottom: 10px;
        }

        .team-card button {
            margin-top: 10px;
            padding: 8px 15px;
            background-color: #DDA15E;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .team-card button:hover {
            background-color: #c68c4f;
        }

        .footer-bar {
            width: 100%;
            height: 200px;
            background-color: #DDA15E;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .header-bar h1 { font-size: 24px; }
            .content-bar { display: none; }
            .hamburger-menu { display: block; }
        }
    </style>

    <title>Suomalaiset antikvariaatit - Etusivu</title>
</head>

<body>

<div class="header-bar">
    <h1>Suomalaiset antikvariaatit</h1>
    <div class="hamburger-menu" onclick="toggleMenu()">&#9776;</div>
</div>

<div class="content-bar">
    <nav class="desktop-nav">
        <a href="#">Etusivu</a>
        <a href="#">Antikvariaatit</a>
        <a href="#">Palaute</a>
        <a href="#">Yhteystiedot</a>
    </nav>
</div>

<nav id="nav-menu" class="mobile-nav">
    <a href="#">Etusivu</a>
    <a href="#">Antikvariaatit</a>
    <a href="#">Palaute</a>
    <a href="#">Yhteystiedot</a>
</nav>

<!-- TULOSSEURANTA -->
<div class="score-section">
    <h2>Joukkueiden tulosseuranta</h2>

    <div class="team-inputs">
        <input type="text" id="team1" placeholder="Joukkue 1 nimi">
        <input type="text" id="team2" placeholder="Joukkue 2 nimi">
        <input type="text" id="team3" placeholder="Joukkue 3 nimi">
        <input type="text" id="team4" placeholder="Joukkue 4 nimi">
    </div>

    <button onclick="createScoreboard()">Aloita tulosseuranta</button>

    <div id="scoreboard" class="scoreboard"></div>
</div>
<div class="footer-bar">
    <h1>Copyright 2025</h1>
</div>

<script>
function toggleMenu() {
    var navMenu = document.getElementById("nav-menu");
    navMenu.style.display = navMenu.style.display === "flex" ? "none" : "flex";
}

function createScoreboard() {
    const scoreboard = document.getElementById("scoreboard");
    scoreboard.innerHTML = "";

    for (let i = 1; i <= 4; i++) {
        const name = document.getElementById("team" + i).value || "Joukkue " + i;

        const teamCard = document.createElement("div");
        teamCard.className = "team-card";

        teamCard.innerHTML = `
            <h3>${name}</h3>
            <p>Pisteet: <span id="score${i}">0</span></p>
            <button onclick="addPoint(${i})">Lisää piste</button>
        `;

        scoreboard.appendChild(teamCard);
    }
}

function addPoint(teamNumber) {
    const scoreElement = document.getElementById("score" + teamNumber);
    let currentScore = parseInt(scoreElement.textContent);
    scoreElement.textContent = currentScore + 1;
}
</script>

</body>
</html>
