<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suomalaiset antikvariaatit - Etusivu</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { display:flex; flex-direction:column; min-height:100vh; font-family:'Roboto', sans-serif; }

.header-bar {
    height:150px;
    background:#DDA15E;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}
.header-bar h1 {
    font-family:'Merriweather', serif;
    font-size:36px;
}

.centered-image {
    max-width:700px;
    width:80%;
    margin:40px auto;
    display:block;
}

.score-section {
    max-width:1000px;
    width:90%;
    margin:20px auto 40px auto;
}

.team-inputs {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
    margin-bottom:15px;
}

.team-inputs input {
    padding:8px;
}

button {
    padding:8px 12px;
    background:#DDA15E;
    border:none;
    cursor:pointer;
    font-weight:bold;
    margin:5px 0;
}

button:hover { background:#c68c4f; }

.scoreboard {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-top:20px;
}

.team-card {
    background:#f4f4f4;
    padding:15px;
    border-radius:10px;
    text-align:center;
    transition:0.3s;
}

.team-card.winner {
    background:#c8e6c9;
    transform:scale(1.05);
}

.points-controls {
    margin-top:10px;
}

.points-controls input {
    width:60px;
    padding:5px;
    text-align:center;
}

.footer-bar {
    margin-top:auto;
    height:120px;
    background:#DDA15E;
    display:flex;
    justify-content:center;
    align-items:center;
}

@media(max-width:768px){
    .header-bar h1 { font-size:24px; }
}
</style>
</head>

<body>

<div class="header-bar">
    <h1>Suomalaiset antikvariaatit</h1>
</div>

<img src="vanhat_kirjat.jpg" alt="Kuva vanhoista kirjoista" class="centered-image">

<div class="score-section">
    <h2>Joukkueiden tulosseuranta</h2>

    <div class="team-inputs">
        <input type="text" id="team1" placeholder="Joukkue 1 nimi">
        <input type="text" id="team2" placeholder="Joukkue 2 nimi">
        <input type="text" id="team3" placeholder="Joukkue 3 nimi">
        <input type="text" id="team4" placeholder="Joukkue 4 nimi">
    </div>

    <button onclick="createScoreboard()">Aloita tulosseuranta</button>
    <button onclick="resetScores()">Nollaa pisteet</button>

    <div id="scoreboard" class="scoreboard"></div>
</div>

<div class="footer-bar">
    <h3>Copyright 2025</h3>
</div>

<script>
let teams = [];

function createScoreboard() {
    teams = [];
    for (let i = 1; i <= 4; i++) {
        const name = document.getElementById("team" + i).value || "Joukkue " + i;
        teams.push({ name: name, score: 0 });
    }
    saveToStorage();
    renderScoreboard();
}

function renderScoreboard() {
    const board = document.getElementById("scoreboard");
    board.innerHTML = "";

    teams.sort((a, b) => b.score - a.score);

    const highestScore = Math.max(...teams.map(t => t.score));

    teams.forEach((team, index) => {
        const card = document.createElement("div");
        card.className = "team-card";
        if (team.score === highestScore && highestScore > 0) {
            card.classList.add("winner");
        }

        card.innerHTML = `
            <h3>${team.name}</h3>
            <p>Pisteet: ${team.score}</p>
            <div class="points-controls">
                <input type="number" id="points${index}" value="1" min="1">
                <br>
                <button onclick="addPoints(${index})">Lisää</button>
                <button onclick="subtractPoints(${index})">Vähennä</button>
            </div>
        `;

        board.appendChild(card);
    });
}

function addPoints(index) {
    const amount = parseInt(document.getElementById("points" + index).value) || 1;
    teams[index].score += amount;
    saveToStorage();
    renderScoreboard();
}

function subtractPoints(index) {
    const amount = parseInt(document.getElementById("points" + index).value) || 1;
    teams[index].score -= amount;
    if (teams[index].score < 0) teams[index].score = 0;
    saveToStorage();
    renderScoreboard();
}

function resetScores() {
    teams.forEach(team => team.score = 0);
    saveToStorage();
    renderScoreboard();
}

function saveToStorage() {
    localStorage.setItem("scoreData", JSON.stringify(teams));
}

function loadFromStorage() {
    const data = localStorage.getItem("scoreData");
    if (data) {
        teams = JSON.parse(data);
        renderScoreboard();
    }
}

window.onload = loadFromStorage;
</script>

</body>
</html>
